<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="founder-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#080f24" />
      <stop offset="100%" stop-color="#02050e" />
    </linearGradient>
    <linearGradient id="accent-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <pattern id="founder-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>
    <radialGradient id="founder-glow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" fill="url(#founder-bg)" />
  <rect width="1200" height="320" fill="url(#founder-glow)" />
  <rect width="1200" height="320" fill="url(#founder-grid)" />
  <rect x="1" y="1" width="1198" height="318" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Right Visual: Harmonic Wavepacket & N-Representability Polytope Wireframe -->
  <g opacity="0.8">
    <!-- Polytope boundary lines (Generalized Pauli constraints) -->
    <polygon points="980,60 1110,130 1060,260 890,240 850,110" fill="none" stroke="#38bdf8" stroke-width="1.3" stroke-opacity="0.4" />
    <polygon points="980,60 1060,260" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.25" />
    <polygon points="1110,130 890,240" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.25" />
    <polygon points="850,110 1060,260" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.25" />

    <!-- Wavepacket / Density dispersion -->
    <path d="M 760 160 Q 840 70, 920 160 T 1080 160" fill="none" stroke="url(#accent-cyan)" stroke-width="2" stroke-opacity="0.75" />
    <path d="M 760 160 Q 840 230, 920 160 T 1080 160" fill="none" stroke="url(#accent-amber)" stroke-width="1.6" stroke-opacity="0.6" />

    <!-- Annotation tags -->
    <text x="890" y="280" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b" letter-spacing="1">1-RDM POLYTOPE · BORLAND-DENNIS BOUND</text>
  </g>

  <!-- Left Side: Identity & Credentials -->
  <text x="64" y="68" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#38bdf8" letter-spacing="3">SCIENTIST-FOUNDER &amp; THEORIST</text>

  <!-- Name in Editorial Garamond -->
  <text x="64" y="128" font-family="'EB Garamond', Garamond, Georgia, serif" font-size="44" font-weight="700" fill="#f8fafc" letter-spacing="0.5">Romit Chakraborty</text>

  <!-- Copper Accent Underline -->
  <rect x="64" y="146" width="90" height="2.5" fill="url(#accent-amber)" rx="1.2" />

  <!-- Role & Mission -->
  <text x="64" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#e2e8f0">
    Founder &amp; CEO, Point Reyes Sound, Inc.
  </text>
  <text x="64" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
    Theoretical Quantum Chemist · Continuous Phase-Space Kinetics · Strongly Correlated Electronic Structure
  </text>

  <!-- Lineage Badges -->
  <g transform="translate(64, 244)">
    <rect x="0" y="0" width="138" height="28" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="69" y="18" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">UChicago Ph.D. ’17</text>

    <rect x="148" y="0" width="168" height="28" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="232" y="18" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">UC Berkeley / LBNL ’23</text>

    <rect x="326" y="0" width="128" height="28" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="390" y="18" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">PsiQuantum ’25</text>

    <rect x="464" y="0" width="120" height="28" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="524" y="18" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">IIT Bombay ’12</text>
  </g>
</svg>
